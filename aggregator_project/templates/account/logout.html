{% extends "account/base.html" %}

{% block auth_content %}
  <div class="auth-card">
    <h2>Log out</h2>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <button class="btn primary" type="submit">Log out</button>
      <a class="btn ghost" href="{% url 'plugins_view' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
