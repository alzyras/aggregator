{% extends "account/base.html" %}

{% block auth_content %}
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-kicker">Welcome back</span>
      <h2>Sign in to your workspace</h2>
      <p class="auth-subtitle">Use your username or email to continue.</p>
    </div>

    <form class="auth-form" method="post" action="{% url 'account_login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="auth-actions">
        <button class="btn primary" type="submit">Log in</button>
        <a class="btn ghost" href="{% url 'account_reset_password' %}">Forgot password</a>
      </div>
    </form>

    <p class="auth-footer">
      New here? <a href="{% url 'account_signup' %}">Create an account</a>
    </p>
  </div>
{% endblock %}
