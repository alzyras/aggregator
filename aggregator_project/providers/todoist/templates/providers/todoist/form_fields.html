{% if spec.source == "todoist" %}
  <div class="form-section">
    <label class="field-label" for="{{ spec.form.api_token.id_for_label }}">{{ spec.form.api_token.label }}</label>
    {{ spec.form.api_token }}
    {% for error in spec.form.api_token.errors %}
      <div class="field-error">{{ error }}</div>
    {% endfor %}
  </div>

  <div class="form-section">
    <div class="form-group-title">Sync scope</div>
    <div class="checkbox-grid">
      <label class="checkbox-card">
        {{ spec.form.sync_tasks }}
        <span>Sync tasks</span>
      </label>
      <label class="checkbox-card">
        {{ spec.form.include_completed }}
        <span>Include completed</span>
      </label>
      <label class="checkbox-card">
        {{ spec.form.include_archived }}
        <span>Include archived</span>
      </label>
    </div>
  </div>

  <div class="form-section">
    <div class="form-group-title">Task events</div>
    <div class="checkbox-grid">
      <label class="checkbox-card">
        {{ spec.form.emit_task_created }}
        <span>Created</span>
      </label>
      <label class="checkbox-card">
        {{ spec.form.emit_task_updated }}
        <span>Updated</span>
      </label>
      <label class="checkbox-card">
        {{ spec.form.emit_task_completed }}
        <span>Completed</span>
      </label>
      <label class="checkbox-card">
        {{ spec.form.emit_task_deleted }}
        <span>Deleted</span>
      </label>
    </div>
  </div>

  <div class="form-section">
    <div class="form-group-title">Task states</div>
    <div class="checkbox-grid">
      <label class="checkbox-card">
        {{ spec.form.task_state_created }}
        <span>Created</span>
      </label>
      <label class="checkbox-card">
        {{ spec.form.task_state_updated }}
        <span>Updated</span>
      </label>
      <label class="checkbox-card">
        {{ spec.form.task_state_completed }}
        <span>Completed</span>
      </label>
    </div>
  </div>
{% endif %}
