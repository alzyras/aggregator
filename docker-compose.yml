services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-aggregator}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-aggregator}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
    depends_on:
      - postgres
      - redis
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-1}
      DJANGO_TRUST_PROXY_SSL_HEADER: ${DJANGO_TRUST_PROXY_SSL_HEADER:-1}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-1}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      CACHE_DEFAULT_TIMEOUT_SECONDS: ${CACHE_DEFAULT_TIMEOUT_SECONDS:-300}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-aggregator}
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-aggregator}
      DB_DEPLOYMENT_MODE: ${DB_DEPLOYMENT_MODE:-built_in}
      VALIDATE_RUNTIME_CONFIG: ${VALIDATE_RUNTIME_CONFIG:-1}
      STRICT_RUNTIME_CONFIG: ${STRICT_RUNTIME_CONFIG:-0}
      JOB_MAX_CONCURRENCY: ${JOB_MAX_CONCURRENCY:-4}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_STALE_RUNNING_SECONDS: ${JOB_STALE_RUNNING_SECONDS:-900}
      SYNC_INCREMENTAL_LOOKBACK_MINUTES: ${SYNC_INCREMENTAL_LOOKBACK_MINUTES:-5}
      AUTO_REFRESH_SCHEDULER_TICK_SECONDS: ${AUTO_REFRESH_SCHEDULER_TICK_SECONDS:-60}
      PLANNER_STATUS_WRITEBACK_MAX_RETRIES: ${PLANNER_STATUS_WRITEBACK_MAX_RETRIES:-3}
      PLANNER_DESCRIPTION_WRITEBACK_MAX_RETRIES: ${PLANNER_DESCRIPTION_WRITEBACK_MAX_RETRIES:-3}
      ENABLED_CONNECTORS: ${ENABLED_CONNECTORS:-}
      AI_DEFAULT_BACKEND: ${AI_DEFAULT_BACKEND:-openai_responses}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-luna}
      AI_QWEN_BASE_URL: ${AI_QWEN_BASE_URL:-}
      AI_QWEN_MODEL: ${AI_QWEN_MODEL:-qwen3}
      AI_QWEN_API_KEY: ${AI_QWEN_API_KEY:-}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      APP_ROLE: web
      APP_PORT: ${APP_PORT:-8000}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      COLLECT_STATIC: ${COLLECT_STATIC:-1}
      AUTO_CREATE_DB: ${AUTO_CREATE_DB:-0}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:${APP_PORT:-8000}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/accounts/login/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
    depends_on:
      - postgres
      - redis
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-1}
      DJANGO_TRUST_PROXY_SSL_HEADER: ${DJANGO_TRUST_PROXY_SSL_HEADER:-1}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-1}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      CACHE_DEFAULT_TIMEOUT_SECONDS: ${CACHE_DEFAULT_TIMEOUT_SECONDS:-300}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-aggregator}
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-aggregator}
      DB_DEPLOYMENT_MODE: ${DB_DEPLOYMENT_MODE:-built_in}
      VALIDATE_RUNTIME_CONFIG: ${VALIDATE_RUNTIME_CONFIG:-1}
      STRICT_RUNTIME_CONFIG: ${STRICT_RUNTIME_CONFIG:-0}
      JOB_MAX_CONCURRENCY: ${JOB_MAX_CONCURRENCY:-4}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_STALE_RUNNING_SECONDS: ${JOB_STALE_RUNNING_SECONDS:-900}
      SYNC_INCREMENTAL_LOOKBACK_MINUTES: ${SYNC_INCREMENTAL_LOOKBACK_MINUTES:-5}
      AUTO_REFRESH_SCHEDULER_TICK_SECONDS: ${AUTO_REFRESH_SCHEDULER_TICK_SECONDS:-60}
      PLANNER_STATUS_WRITEBACK_MAX_RETRIES: ${PLANNER_STATUS_WRITEBACK_MAX_RETRIES:-3}
      PLANNER_DESCRIPTION_WRITEBACK_MAX_RETRIES: ${PLANNER_DESCRIPTION_WRITEBACK_MAX_RETRIES:-3}
      ENABLED_CONNECTORS: ${ENABLED_CONNECTORS:-}
      AI_DEFAULT_BACKEND: ${AI_DEFAULT_BACKEND:-openai_responses}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-luna}
      AI_QWEN_BASE_URL: ${AI_QWEN_BASE_URL:-}
      AI_QWEN_MODEL: ${AI_QWEN_MODEL:-qwen3}
      AI_QWEN_API_KEY: ${AI_QWEN_API_KEY:-}
      APP_ROLE: worker
      WAIT_FOR_DB: ${WAIT_FOR_DB:-1}
      RUN_MIGRATIONS: 0
      COLLECT_STATIC: 0
      AUTO_CREATE_DB: ${AUTO_CREATE_DB:-0}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - web
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  postgres_data:
